name: Build CHOUHAN EMPIRE APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK with Gradle 8.7
        run: |
          gradle assembleRelease || gradle assembleDebug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chouhan-empire-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Create Release v2.2.11
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.11
          name: "CHOUHAN EMPIRE Release v2.2.11"
          body: "CHOUHAN EMPIRE 👑 11 Agents in 1 App with Gemini, Groq, ElevenLabs Connectors, Voice Clone Studio, and RESUMAX ATS Scanner."
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
